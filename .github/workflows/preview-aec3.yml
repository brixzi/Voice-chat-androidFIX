      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Install Android NDK 27.2 (arm64 cross-compiler)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager missing from $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Found SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'ndk;27.2.12479018' 'cmake;3.22.1'
          test -f "$SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Verify Simple Voice Chat 2.6.27 Forge bytecode
        run: python3 scripts/verify_voicechat_target.py
      - name: Verify and fetch original four Android JNI libraries
        run: python3 scripts/fetch_natives.py
      - name: Align WebRTC SONAME to verified Android M155 binary
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/fetch_webrtc_apm.py scripts/build_aec3_android.sh \
            scripts/verify_jar.py src/main/java/dev/dreadbound/voicechat/aec3/NativeAec3.java; do
            grep -qF 'libwebrtc-audio-processing-3.so.1' "$file"
            sed -i 's/libwebrtc-audio-processing-3\.so\.1/libwebrtc-audio-processing-3.so/g' "$file"
          done
      - name: Fetch WebRTC M155 Android AEC3 (SHA256-pinned)
        run: python3 scripts/fetch_webrtc_apm.py
      - name: Compile WebRTC AEC3 JNI bridge for Android ARM64
        run: |
          set -euo pipefail
          sed -i 's/^target_include_directories(dreadbound_aec3 PRIVATE$/target_include_directories(dreadbound_aec3 SYSTEM PRIVATE/' native/aec3/CMakeLists.txt
          grep -qF 'target_include_directories(dreadbound_aec3 SYSTEM PRIVATE' native/aec3/CMakeLists.txt
          bash scripts/build_aec3_android.sh
      - name: Run JVM and audio timeline tests
        run: bash tests/run_jvm_tests.sh
      - name: Compile Forge 1.20.1 mod
        run: gradle --no-daemon --stacktrace build
      - name: Check compiled JAR has Mixin classes and both native libraries
        run: python3 scripts/verify_jar.py
      - name: Upload experimental mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChat-Android-AEC3-v0.3.0-EXPERIMENTAL
          path: build/libs/*-aec3-experimental.jar
          if-no-files-found: error
          retention-days: 14
