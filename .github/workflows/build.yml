name: Build experimental Forge port
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Fetch pinned upstream Android NDK binaries and validate
        run: python3 scripts/fetch_natives.py
      - name: Build Forge mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: dreadbound-voicechat-android-forge-EXPERIMENTAL
          path: build/libs/*-experimental.jar
          if-no-files-found: error
