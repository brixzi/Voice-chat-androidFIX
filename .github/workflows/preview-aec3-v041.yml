            "V2L2RyZWFkYm91bmQvdm9pY2VjaGF0L0FuZHJvaWROYXRpdmVSZXNvdXJjZXMuamF2YVBLAQIUAxQAAAAIAAyjb11zGowdkwAAAP4AAABEAAAAAAAA"
            "AAAAAACkgY+iAAB0ZXN0cy9zdHVicy9kZXYvZHJlYWRib3VuZC92b2ljZWNoYXQvRHJlYWRib3VuZFZvaWNlY2hhdEFuZHJvaWQuamF2YVBLAQIUAx"
            "QAAAAIAAyjb10A0zjPaAAAAHUAAAA7AAAAAAAAAAAAAACkgYSjAAB0ZXN0cy9zdHVicy9kZXYvZHJlYWRib3VuZC92b2ljZWNoYXQvYWVjMy9HYW1l"
            "QXVkaW9UYXAuamF2YVBLAQIUAxQAAAAIAAyjb12F2c9WwgAAACsBAAA5AAAAAAAAAAAAAACkgUWkAAB0ZXN0cy9zdHVicy9kZXYvZHJlYWRib3VuZC"
            "92b2ljZWNoYXQvYWVjMy9OYXRpdmVBZWMzLmphdmFQSwECFAMUAAAACAAlo29d1B7g3M0BAABdAwAAHAAAAAAAAAAAAAAApIFepQAAdGVzdHMvdmVy"
            "aWZ5X21pY19jb250cmFjdC5weVBLBQYAAAAAKgAqAF4OAABlpwAAAAA="
          )
          payload = base64.b64decode(compressed)
          digest = hashlib.sha256(payload).hexdigest()
          if digest != SOURCE_ZIP_SHA256:
              raise SystemExit(f'Embedded source SHA256 mismatch: {digest}')
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              entries = z.infolist()
              for entry in entries:
                  if entry.is_dir(): continue
                  relative = pathlib.PurePosixPath(entry.filename)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit('Unsafe ZIP path: '+entry.filename)
                  dest = pathlib.Path(*relative.parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(entry))
          print('Restored',len(entries),'source entries from SHA256-pinned snapshot',digest)
          PYSOURCE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Install Android NDK 27.2 (arm64 cross-compiler)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager missing from $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Found SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'ndk;27.2.12479018' 'cmake;3.22.1'
          test -f "$SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Verify Simple Voice Chat 2.6.27 Forge bytecode
        run: python3 scripts/verify_voicechat_target.py
      - name: Verify and fetch original four Android JNI libraries
        run: python3 scripts/fetch_natives.py
      - name: Fetch WebRTC M155 Android AEC3 (SHA256-pinned)
        run: python3 scripts/fetch_webrtc_apm.py
      - name: Compile WebRTC AEC3 JNI bridge for Android ARM64
        run: bash scripts/build_aec3_android.sh
      - name: Run JVM and audio timeline tests
        run: bash tests/run_jvm_tests.sh
      - name: Guard against synthetic Mixin Args playback crash
        run: python3 scripts/check_playback_source.py
      - name: Compile Forge 1.20.1 mod
        run: gradle --no-daemon --stacktrace build
      - name: Check compiled JAR has voice/game Mixin classes and AEC3 native libraries
        run: python3 scripts/verify_jar.py
      - name: Upload experimental mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChat-Android-AEC3-v0.4.1-AUDIO-CONTINUITY
          path: build/libs/*-audio-continuity-experimental.jar
          if-no-files-found: error
          retention-days: 14
