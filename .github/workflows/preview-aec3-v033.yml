      - name: Compile Forge 1.20.1 mod
        run: gradle --no-daemon --stacktrace build
      - name: Check compiled JAR has Mixin classes and both native libraries
        run: python3 scripts/verify_jar.py
      - name: Upload experimental mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChat-Android-VOICE-CAPTURE-v0.3.3-EXPERIMENTAL
          path: build/libs/*-aec3-experimental.jar
          if-no-files-found: error
          retention-days: 14
